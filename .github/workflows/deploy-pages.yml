name: Publicar GLOWTEX en GitHub Pages

# Se ejecuta automáticamente en cada push a main o master.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Permisos necesarios para publicar en Pages usando GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita dos despliegues al mismo tiempo.
concurrency:
  group: glowtex-pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Publicar sitio
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
